<!DOCTYPE html>
<link rel="stylesheet" href="../Programacion_web/css/style_Ejercicio7.css">
 <header class="header_container">
        <h1 class="header_title">RIGBYSTORE</h1>
        
        <nav class="header_option_container">
            <a href="#launch" class="header_option">LANZAMIENTO</a>
            <a href="#aboutUs" class="header_option">SOBRE NOSOTROS</a>
            <a href="#mailList" class="header_option">LISTA DE CORREOS</a>
        </nav>
        <div class="button_header_container">
            <button class="button_style_moneyType">MXN</button>
            <button class="button_image_cart"><img src="../Programacion_web/img/carrito_compra.png" width="40px" height="40px"></button>
        </div>
    </header>

    <body>
        <!-- Lugar provisional para formulario -->
        <div class="color_block1">
         <div>
            <form action="Ejercicio_7.html" method="get">
                <div class="review_container">
                    <h3>Reseña</h3>
                        <fieldset>
                            <!-- Título de resena -->
                            <div class="review_section_container">
                                <label for="tituloReseña">Título</label>
                                <br>
                                <input type="text" name="Título de resena" id="tituloReseña" placeholder="Título de reseña...">
                            </div>
            
                            <br>
                            <!-- Descripción resena -->
                            <div class="review_section_container">
                                <label for="descripcion">Descripción</label>
                                <br>
                                <textarea name="Descripcion" id="descripcion" placeholder="Escribe tu experiencia..."></textarea>
                            </div>
            
                            <br>
                            <!-- Selección estrellas resena -->
                            <div class="review_section_container">
                                <label for="estrella">Estrellas</label>
                                <br>
                                <select name="estrellas" id="estrella">
                                    <optgroup>
                                        <option value="0">-- Seleccionar estrellas --</option>
                                        <option value="1">1 Estrellas</option>
                                        <option value="2">2 Estrellas</option>
                                        <option value="3">3 Estrellas</option>
                                        <option value="4">4 Estrellas</option>
                                        <option value="5">5 Estrellas</option>
                                    </optgroup>
                                </select>
                            </div>
            
                            <br>
                            <!-- Autocompletado de tipo de usuario -->
                            <div class="review_section_container">
                                <label for="tipoUsuarios">Tipo de Usuario</label>
                                <br>
                                    <input name="tipo de Usuario" list="tipoUsuarios" id="tipoUsuario" placeholder="Define tipo de usuario...">
                                    <datalist id="tipoUsuarios">
                                        <option value="Nuevo usuario">1</option>
                                        <option value="Usuario promedio">2</option>
                                        <option value="Usuario veterano">3</option>
                                    </datalist>
                            </div>
                            <br>
                        </fieldset>
                        <button class="button_send" type="submit">Enviar</button>
                </div>
            </form>
            </div>
        </div>
        <div class="color_block2"></div>
        <div class="color_block3"></div>
    </body>
